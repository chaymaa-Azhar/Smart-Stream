<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Stream</title>
  <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col">

  <!-- Header -->
  <header class="h-14 px-4 flex items-center justify-between bg-gray-950 border-b border-gray-400">
    <h1 class="text-xl font-bold text-red-500">Smart Stream</h1>
    <span class="text-sm text-gray-400">TV en direct</span>
  </header>

  <div class="flex">

    <!-- Sidebar : liste des chaînes -->
    <aside class="w-80 bg-gray-950 border-r border-gray-800 flex flex-col">
      <div class="p-3">
        <input id="search-input" type="text" placeholder="Rechercher une chaîne..."
          class="w-full px-3 py-2 rounded bg-gray-800 text-sm placeholder-gray-500  ">
      </div>

      <ul id="channel-list" >
        <li class="flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-gray-800 bg-gray-800">
          <div class="w-10 rounded-2xl "><img src="/src/images/2M.png" alt=""></div>
          <div>
            <p class="text-sm font-medium">2M</p>
            <p class="text-xs text-gray-400">Catégorie</p>
          </div>
        </li>
        <li class="flex items-center gap-3 px-3 py-2 cursor-pointer hover:bg-gray-800">
          <div class="w-10 h-10 rounded-2xl"><img src="src/images/Aloula.png" alt=""></div>
          <div>
            <p class="text-sm font-medium">Nom de la chaîne</p>
            <p class="text-xs text-gray-400">Catégorie</p>
          </div>
        </li>
      </ul>
    </aside>

    <!-- Zone de prévisualisation -->
    <main id="preview" class="flex-1 p-6 overflow-y-auto">
      <div class="max-w-4xl bg-black rounded-lg flex items-center justify-center text-gray-500">
         image
      </div>

      <div class="max-w-4xl mt-4">
        <h2 id="channel-name" class="text-2xl font-bold">Nom de la chaîne</h2>
        <p id="channel-category" class="text-sm text-gray-400">Catégorie · Langue · Pays</p>
        <p id="channel-description" class="mt-3 text-gray-300">Description de la chaîne...</p>

        <!-- Bonus : EPG
        <div class="mt-6">
          <p class="text-sm text-gray-400">En cours : Nom du programme</p>
          <div class="h-2 mt-2 bg-gray-700 rounded">
            <div class="h-2 bg-red-500 rounded w-1/3"></div>
          </div>
        </div>
      </div> -->
    </main>

  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
