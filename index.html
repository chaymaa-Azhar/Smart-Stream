<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Stream</title>
  <link href="./css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col">

  <!-- Header -->
  <header class="h-14 px-4 flex items-center justify-between bg-gray-800">
    <h1 class="text-xl font-bold">Smart Stream</h1>
    <span class="text-sm text-gray-400">TV en direct</span>
  </header>

  <div class="flex flex-1 ">

    <!-- Sidebar -->
    <aside class="w-80 bg-gray-800 flex flex-col ">
     
      <!-- category  -->
       <div class="px-3 pb-3">
  <button id="category-toggle" class="w-full flex justify-between p-2 rounded bg-gray-700 text-sm">
    <span id="category-label">TOUS</span>
    <span>▾</span>
  </button>

  <div id="category-menu" class="hidden mt-1 rounded bg-gray-700">
    <button data-category="TOUS" class="block w-full px-3 py-2 text-left text-sm hover:bg-gray-600">TOUS</button>
    <button data-category="GÉNÉRALISTE" class="block w-full px-3 py-2 text-left text-sm hover:bg-gray-600">GÉNÉRALISTE</button>
    <button data-category="SPORT" class="block w-full px-3 py-2 text-left text-sm hover:bg-gray-600">SPORT</button>
    <button data-category="ENFANTS" class="block w-full px-3 py-2 text-left text-sm hover:bg-gray-600">ENFANTS</button>
    <button data-category="DOCUMENTAIRE" class="block w-full px-3 py-2 text-left text-sm hover:bg-gray-600">DOCUMENTAIRE</button>
    <button data-category="MUSIQUE" class="block w-full px-3 py-2 text-left text-sm hover:bg-gray-600">MUSIQUE</button>



  </div>
</div>
      <!-- category  -->




      <div class="p-3">
        <input id="search-input" type="text" placeholder="Rechercher une chaîne..."
          class="w-full p-2 rounded bg-gray-700 text-sm text-white">
      </div>

      <!-- Chargement -->
      <div id="loader" class="hidden">
        <div class="flex flex-col items-center gap-2 p-4 text-gray-400">
          <div class="h-8 w-8 animate-spin rounded-full border-4 border-red-600 border-t-white"></div>
          <p class="text-sm">Chargement des chaînes...</p>
        </div>
      </div>

      <!-- Erreur -->
      <div id="error" class="hidden m-3 p-3 rounded bg-gray-700 text-center">
        <p id="error-msg" class="text-sm"></p>
        <button id="retry" class="mt-2 px-3 py-1 rounded bg-gray-600 text-sm">Réessayer</button>
      </div>

      <!-- Liste (remplie par JS) -->
      <ul id="channel-list" class="flex-1 overflow-y-auto"></ul>

      
    </aside>

    <!-- Preview -->
    <main class="flex-1 p-6 overflow-y-auto">

      <p id="preview-placeholder" class="text-gray-400">Sélectionnez une chaîne</p>

      <div id="preview-content" class="w-full h-full">
        <img id="preview-image" src="" alt="" class="w-full object-cover">

        <div class="mt-4 flex items-center gap-3">
          <span id="channel-number" class="px-2 py-1 rounded bg-gray-700 text-sm"></span>
          <h2 id="channel-title" class="text-2xl font-bold"></h2>
        </div>
        <p id="channel-category" class="mt-1 text-sm text-gray-400"></p>

        <!-- Bonus : EPG (plus tard)
        <div class="mt-6">
          <p class="text-sm text-gray-400">En cours : Nom du programme</p>
          <div class="mt-2 h-2 rounded bg-gray-700">
            <div class="h-2 w-1/3 rounded bg-gray-300"></div>
          </div>
        </div>
        -->
      </div>

    </main>

  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
